name: Native verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AGENTBOX_TEST_OMZ: ${{ github.workspace }}/.ci-fixtures/oh-my-zsh
      AGENTBOX_TEST_AUTOSUGGEST: ${{ github.workspace }}/.ci-fixtures/zsh-autosuggestions/zsh-autosuggestions.zsh
      AGENTBOX_TEST_HIGHLIGHT: ${{ github.workspace }}/.ci-fixtures/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Oh My Zsh fixture
        uses: actions/checkout@v4
        with:
          repository: ohmyzsh/ohmyzsh
          ref: 67cd8c4673512d08238461f7ce00715da01665d4
          path: .ci-fixtures/oh-my-zsh
          persist-credentials: false
      - name: Pinned autosuggestions fixture
        uses: actions/checkout@v4
        with:
          repository: zsh-users/zsh-autosuggestions
          ref: a411ef3e0992d4839f0732ebeb9823024afaaaa8
          path: .ci-fixtures/zsh-autosuggestions
          persist-credentials: false
      - name: Pinned syntax-highlighting fixture
        uses: actions/checkout@v4
        with:
          repository: zsh-users/zsh-syntax-highlighting
          ref: db085e4661f6aafd24e5acb5b2e17e4dd5dddf3e
          path: .ci-fixtures/zsh-syntax-highlighting
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/verify.sh
      - name: Install Zsh for native-shell tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: cargo build --locked
      - run: python3 scripts/test-macos-cli.py
      - run: python3 scripts/test-zsh-plugins.py
      - run: python3 scripts/test-shell-state.py
      - name: Zsh state under C locale
        run: python3 scripts/test-shell-state.py
        env:
          AGENTBOX_TEST_LOCALE: C
      - run: python3 scripts/test-shell.py
      - run: python3 scripts/test-attach.py
      - run: python3 scripts/test-bulk-output.py
      - run: python3 scripts/test-concurrency.py
      - run: cargo test --locked --test local_e2e -- --ignored --test-threads=1
        env:
          AGENTBOX_ALLOW_SOCKET_TESTS: '1'
      - run: cargo build --locked --release
      - name: Verify release binary
        run: |
          python3 scripts/test-macos-cli.py
          python3 scripts/test-zsh-plugins.py
          python3 scripts/test-shell-state.py
          python3 scripts/test-shell.py
          python3 scripts/test-attach.py
          python3 scripts/test-bulk-output.py
          python3 scripts/test-concurrency.py
        env:
          AGENTBOX_TEST_BIN: ${{ github.workspace }}/target/release/agentbox
      - run: bash scripts/package.sh
      - run: python3 scripts/package-release.py
